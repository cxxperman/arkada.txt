# The same plugin for Millennium's newer packed format (.star), built by its own compiler, starlight:
#   npm install          (inside this folder; nothing is installed globally)
#   npm run build:star   → dist-star/arkada.star
# The folder layout Millennium also loads (plugin.json + .millennium/Dist/index.js) is built by build.js
# and needs none of this.
# There is deliberately no [dev] section and no output_path = "auto": with them starlight writes into the
# Steam folder and restarts the plugin in a running Steam.

[plugin]
id = "arkada"
name = "Arkada"
version = "0.4.1"
author = "dev.txt"
description = "Tells the other dev.txt apps on this PC what Steam is doing, sends Steam notifications to Kapsula, shows the size on disk and How Long To Beat times of a game, Dota 2 statistics on profiles, adds Share, prices (SteamDB, IsThereAnyDeal with your own key), your playtime and links to store pages, hides owned games in store lists, sums wishlists, prices inventories and totals the market history. What goes to the internet, and where, is said for each feature in its setting."

[backend]
# The Lua backend (window backdrop, see backend/main.lua; How Long To Beat, backend/arkada_hltb*.lua; IsThereAnyDeal, backend/arkada_itad.lua); Millennium runs it from the packed file
entry = "backend/main.lua"
sources = ["backend/main.lua", "backend/arkada_hltb.lua", "backend/arkada_hltb_ids.lua", "backend/arkada_itad.lua"]

[frontend]
entry = "src/star.mjs"

[compiler]
output_path = "dist-star/arkada.star"
